[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "setrem-estagio-canis"
version = "0.1.0"
description = "Sistema de Gestão para centralizar resgates, adoções e recursos na Patas e Pelos"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "fastapi>=0.142.1",
    "jinja2>=3.1.6",
    "orjson>=3.12.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

#[project.scripts]

[tool.setuptools.packages.find]
where = ["."]
include = ["setrem_estagio_canis*"]

[project.optional-dependencies]
dev = ["ruff", "pytest", "pytest-asyncio", "pre-commit"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]  # erros, imports, upgrades, bugbear, simplify

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
]
