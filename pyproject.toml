[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "setrem-estagio-canis"
version = "0.2.0"
description = "Sistema de Gestao para centralizar resgates, adocoes e recursos na Patas e Pelos"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "alembic>=1.13.0",
    "bcrypt>=4.0.0",
    "fastapi>=0.142.1",
    "jinja2>=3.1.6",
    "orjson>=3.12.0",
    "psycopg[binary]>=3.1.0",
    "pyjwt>=2.8.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.0",
    "uvicorn>=0.54.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["setrem_estagio_canis*"]

[project.optional-dependencies]
dev = ["ruff", "pytest", "pytest-asyncio", "pre-commit", "httpx2>=2.13.1"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["setrem_estagio_canis"]
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.3.1",
    "pytest>=8.0.0",
    "ruff>=0.11.0",
]
