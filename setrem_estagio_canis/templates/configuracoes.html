{% extends "base.html" %}

{% block content %}
<div class="max-w-2xl space-y-6">

    <div>
        <h1 class="text-2xl font-bold tracking-tight text-ink-primary">Configurações da Conta</h1>
        <p class="text-sm text-ink-secondary mt-0.5">
            Personalize seu nome de exibição, foto de perfil e preferência visual.
        </p>
    </div>

    {% if msg_ok %}
    <div class="p-3.5 rounded-xl bg-patas-green/15 border border-patas-green/25 text-xs text-patas-green font-medium">
        {{ msg_ok }}
    </div>
    {% endif %}

    <form action="/auth/perfil" method="post" enctype="multipart/form-data" class="bg-surface border border-subtle rounded-2xl p-6 space-y-6">

        <!-- Avatar Upload -->
        <div class="flex items-center gap-4 p-4 rounded-xl bg-elevated/60 border border-subtle">
            <label for="input-foto-perfil" class="relative w-16 h-16 rounded-full bg-surface border border-subtle flex items-center justify-center text-base font-bold text-ink-primary overflow-hidden cursor-pointer shrink-0 group">
                {% if tem_avatar %}
                <img id="preview-avatar" src="/auth/avatar" alt="Foto de perfil" class="w-full h-full object-cover">
                {% elif current_user.avatar_url %}
                <img id="preview-avatar" src="{{ current_user.avatar_url }}" alt="Foto de perfil" class="w-full h-full object-cover">
                {% else %}
                <span id="iniciais-avatar">{{ current_user.nome[:2]|upper }}</span>
                <img id="preview-avatar" src="" alt="Foto de perfil" class="w-full h-full object-cover hidden">
                {% endif %}
                <span class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 flex items-center justify-center text-[11px] font-semibold text-white transition-opacity">
                    Trocar
                </span>
            </label>
            <div class="space-y-1 min-w-0">
                <label for="input-foto-perfil" class="text-xs font-semibold text-ink-primary hover:text-patas-green cursor-pointer block">
                    Alterar foto de perfil
                </label>
                <p class="text-[11px] text-ink-muted">PNG, JPG ou WEBP (máx. 5 MB · redimensionada automaticamente)</p>
                <input
                    id="input-foto-perfil"
                    type="file"
                    name="foto"
                    accept="image/png,image/jpeg,image/webp"
                    data-crop-square="true"
                    data-crop-size="384"
                    data-crop-preview="preview-avatar"
                    class="sr-only">
            </div>
        </div>

        <!-- Name & Account Info -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="space-y-1.5 sm:col-span-2">
                <label for="perfil-nome" class="block text-xs font-medium text-ink-secondary">
                    Nome de exibição
                </label>
                <input
                    id="perfil-nome"
                    type="text"
                    name="nome"
                    required
                    value="{{ current_user.nome }}"
                    class="w-full px-3.5 py-2.5 text-sm bg-elevated border border-subtle rounded-xl text-ink-primary focus:outline-none focus:border-patas-blue focus:ring-1 focus:ring-patas-blue">
            </div>

            <div class="space-y-1.5">
                <label class="block text-xs font-medium text-ink-secondary">E-mail</label>
                <input
                    type="text"
                    disabled
                    value="{{ current_user.email }}"
                    class="w-full px-3.5 py-2.5 text-xs font-mono bg-canvas/60 border border-subtle rounded-xl text-ink-muted cursor-not-allowed">
            </div>

            <div class="space-y-1.5">
                <label class="block text-xs font-medium text-ink-secondary">Permissão</label>
                <input
                    type="text"
                    disabled
                    value="{{ 'Administrador' if current_user.role == 'admin' else 'Voluntário' }}"
                    class="w-full px-3.5 py-2.5 text-xs bg-canvas/60 border border-subtle rounded-xl text-ink-muted cursor-not-allowed">
            </div>
        </div>

        <!-- Theme Preference -->
        <div class="space-y-2.5 pt-2 border-t border-subtle">
            <span class="block text-xs font-medium text-ink-secondary">Aparência da interface</span>
            <div class="grid grid-cols-2 gap-3">
                <label class="flex items-center gap-3 p-3.5 rounded-xl bg-elevated border border-subtle cursor-pointer has-[:checked]:border-patas-green has-[:checked]:bg-patas-green/10 transition-colors">
                    <input
                        type="radio"
                        name="tema"
                        value="dark"
                        {% if (current_user.tema or 'dark') == 'dark' %}checked{% endif %}
                        class="accent-[#05AC78]">
                    <div>
                        <span class="block text-xs font-semibold text-ink-primary">Escuro</span>
                        <span class="block text-[11px] text-ink-muted">Padrão do Laika</span>
                    </div>
                </label>

                <label class="flex items-center gap-3 p-3.5 rounded-xl bg-elevated border border-subtle cursor-pointer has-[:checked]:border-patas-green has-[:checked]:bg-patas-green/10 transition-colors">
                    <input
                        type="radio"
                        name="tema"
                        value="light"
                        {% if current_user.tema == 'light' %}checked{% endif %}
                        class="accent-[#05AC78]">
                    <div>
                        <span class="block text-xs font-semibold text-ink-primary">Claro</span>
                        <span class="block text-[11px] text-ink-muted">Alto brilho</span>
                    </div>
                </label>
            </div>
        </div>

        <div class="pt-3 border-t border-subtle flex justify-end">
            <button
                type="submit"
                class="px-5 py-2.5 rounded-xl bg-patas-green hover:bg-patas-green-hover text-[#061c14] text-xs font-semibold transition-colors">
                Salvar Alterações
            </button>
        </div>
    </form>

</div>

<script>
    function previewAvatar(input) {
        if (!input.files || !input.files[0]) return;
        const reader = new FileReader();
        reader.onload = function (e) {
            const img = document.getElementById('preview-avatar');
            const initials = document.getElementById('iniciais-avatar');
            if (img) {
                img.src = e.target.result;
                img.classList.remove('hidden');
            }
            if (initials) initials.classList.add('hidden');
        };
        reader.readAsDataURL(input.files[0]);
    }
</script>
{% endblock %}
