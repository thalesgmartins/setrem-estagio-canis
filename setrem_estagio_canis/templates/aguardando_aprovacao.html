<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aguardando Aprovacao — Laika</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/css/tailwind.min.css">
    <link rel="stylesheet" href="/static/css/materialdesignicons.min.css">
</head>
<body class="bg-canvas text-ink-primary min-h-screen flex items-center justify-center p-6 font-sans antialiased">
    <main class="w-full max-w-md bg-surface border border-subtle rounded-2xl p-8 space-y-6 text-center">
        <div class="w-12 h-12 mx-auto rounded-xl bg-patas-orange/15 border border-patas-orange/30 flex items-center justify-center text-patas-orange">
            <i class="mdi mdi-clock-outline text-2xl"></i>
        </div>

        <div class="space-y-2">
            <h1 class="text-xl font-bold tracking-tight">Acesso aguardando aprovacao</h1>
            <p class="text-sm text-ink-secondary leading-relaxed">
                Ola, <strong class="text-ink-primary">{{ current_user.nome }}</strong> ({{ current_user.email }}).
                Sua conta foi registrada e aguarda liberacao da Coordenacao para acessar o painel interno.
            </p>
        </div>

        <div class="pt-2 flex flex-col gap-2.5">
            <a href="/adocao"
               class="w-full py-2.5 px-4 rounded-xl bg-patas-green hover:bg-patas-green-hover text-[#061c14] text-xs font-semibold transition-colors">
                Ver Catalogo Publico de Adocao
            </a>
            <a href="/auth/logout"
               class="w-full py-2.5 px-4 rounded-xl bg-elevated hover:bg-subtle border border-subtle text-xs font-medium text-ink-primary transition-colors">
                Sair e trocar de conta
            </a>
        </div>
    </main>
</body>
</html>
