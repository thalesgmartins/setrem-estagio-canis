<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adocao — Patas e Pelos</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/css/tailwind.min.css">
    <link rel="stylesheet" href="/static/css/materialdesignicons.min.css">
    <script src="/static/js/htmx.min.js"></script>
</head>
<body class="bg-canvas text-ink-primary min-h-screen font-sans antialiased flex flex-col">

    <!-- Clean Public Top Bar (No Volunteer Link) -->
    <header class="bg-surface/90 backdrop-blur-md border-b border-subtle sticky top-0 z-30">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">
            <a href="/adocao" class="flex items-center gap-3">
                <img src="/static/laika-logo.svg" alt="Patas e Pelos" class="w-8 h-8 object-contain">
                <div class="leading-tight">
                    <span class="block text-sm font-bold text-ink-primary">Patas e Pelos</span>
                    <span class="block text-[11px] text-ink-secondary">Adocao Responsavel</span>
                </div>
            </a>
        </div>
    </header>

    <!-- Main Public Catalog -->
    <main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-10 space-y-8">

        <!-- Hero Intro -->
        <section class="space-y-3 max-w-2xl">
            <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-md text-[11px] font-semibold bg-patas-green/15 text-patas-green border border-patas-green/25">
                <i class="mdi mdi-paw text-sm"></i>
                <span>Catalogo Publico de Adocao</span>
            </span>
            <h1 class="text-3xl sm:text-4xl font-bold tracking-tight text-ink-primary">
                Encontre seu proximo companheiro
            </h1>
            <p class="text-sm text-ink-secondary leading-relaxed">
                Todos os animais abaixo estao prontos para ganhar um lar responsavel. Clique em "Quero Adotar" para falar com a equipe pelo WhatsApp.
            </p>
        </section>

        <!-- HTMX Filters -->
        <section class="bg-surface border border-subtle rounded-xl p-4 flex flex-col sm:flex-row gap-3 items-stretch sm:items-center">
            <div class="flex-1 grid grid-cols-1 sm:grid-cols-2 gap-3">
                <select
                    name="especie"
                    hx-get="/adocao/busca"
                    hx-trigger="change"
                    hx-target="#catalogo-grid"
                    hx-include="[name='porte']"
                    class="px-3.5 py-2.5 text-xs bg-elevated border border-subtle rounded-xl text-ink-primary focus:outline-none focus:border-patas-blue focus:ring-1 focus:ring-patas-blue">
                    <option value="">Todas as especies (Caes e Gatos)</option>
                    <option value="Canina">Caes</option>
                    <option value="Felina">Gatos</option>
                </select>

                <select
                    name="porte"
                    hx-get="/adocao/busca"
                    hx-trigger="change"
                    hx-target="#catalogo-grid"
                    hx-include="[name='especie']"
                    class="px-3.5 py-2.5 text-xs bg-elevated border border-subtle rounded-xl text-ink-primary focus:outline-none focus:border-patas-blue focus:ring-1 focus:ring-patas-blue">
                    <option value="">Todos os portes</option>
                    <option value="Pequeno">Porte Pequeno</option>
                    <option value="Medio">Porte Medio</option>
                    <option value="Grande">Porte Grande</option>
                </select>
            </div>
        </section>

        <!-- Animal Cards Container -->
        <section id="catalogo-grid">
            {% include "fragments/catalogo_cards.html" %}
        </section>

    </main>

</body>
</html>
