<div
    class="fixed inset-0 z-50 bg-black/75 backdrop-blur-[2px] flex items-center justify-center p-4 overflow-y-auto"
    onclick="if (event.target === this) closeModal();">
    <div class="bg-surface border border-subtle rounded-2xl w-full max-w-xl overflow-hidden shadow-2xl">
        <div class="px-6 py-4 border-b border-subtle flex items-center justify-between">
            <div>
                <h3 class="text-base font-bold text-ink-primary">Registrar Novo Resgate</h3>
                <p class="text-xs text-ink-secondary mt-0.5">Entrada inicial de animal acolhido pela ONG Patas e Pelos</p>
            </div>
            <button
                type="button"
                onclick="closeModal()"
                aria-label="Fechar"
                class="p-1.5 rounded-lg text-ink-secondary hover:text-ink-primary hover:bg-elevated">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <form action="/animais" method="post" class="p-6 space-y-4 text-xs">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="space-y-1.5">
                    <label class="block font-medium text-ink-secondary">Nome provisorio</label>
                    <input type="text" name="name" required placeholder="Ex: Bob" class="w-full px-3.5 py-2.5 bg-elevated border border-subtle rounded-xl text-ink-primary placeholder-ink-muted focus:outline-none focus:border-patas-blue focus:ring-1 focus:ring-patas-blue">
                </div>
                <div class="space-y-1.5">
                    <label class="block font-medium text-ink-secondary">Especie</label>
                    <select name="species" class="w-full px-3.5 py-2.5 bg-elevated border border-subtle rounded-xl text-ink-primary focus:outline-none focus:border-patas-blue focus:ring-1 focus:ring-patas-blue">
                        <option value="Canina">Canina</option>
                        <option value="Felina">Felina</option>
                    </select>
                </div>
                <div class="space-y-1.5">
                    <label class="block font-medium text-ink-secondary">Porte estimado</label>
                    <select name="size" class="w-full px-3.5 py-2.5 bg-elevated border border-subtle rounded-xl text-ink-primary focus:outline-none focus:border-patas-blue focus:ring-1 focus:ring-patas-blue">
                        <option value="Pequeno">Pequeno</option>
                        <option value="Medio">Medio</option>
                        <option value="Grande">Grande</option>
                    </select>
                </div>
                <div class="space-y-1.5">
                    <label class="block font-medium text-ink-secondary">Destino inicial</label>
                    <input type="text" name="location" required placeholder="Ex: Canil Central ou Clinica Parceira" class="w-full px-3.5 py-2.5 bg-elevated border border-subtle rounded-xl text-ink-primary placeholder-ink-muted focus:outline-none focus:border-patas-blue focus:ring-1 focus:ring-patas-blue">
                </div>
            </div>

            <div class="space-y-1.5">
                <label class="block font-medium text-ink-secondary">Observacoes do resgate</label>
                <textarea rows="3" name="rescue_notes" required placeholder="Local do resgate, condicao fisica aparente e urgencias clinicas..." class="w-full px-3.5 py-2.5 bg-elevated border border-subtle rounded-xl text-ink-primary placeholder-ink-muted focus:outline-none focus:border-patas-blue focus:ring-1 focus:ring-patas-blue"></textarea>
            </div>

            <div class="pt-3 border-t border-subtle flex justify-end gap-2.5">
                <button
                    type="button"
                    onclick="closeModal()"
                    class="px-4 py-2 rounded-xl bg-elevated hover:bg-subtle border border-subtle font-medium text-ink-primary transition-colors">
                    Cancelar
                </button>
                <button
                    type="submit"
                    class="px-4 py-2 rounded-xl bg-patas-green hover:bg-patas-green-hover text-[#061c14] font-semibold transition-colors">
                    Salvar Resgate
                </button>
            </div>
        </form>
    </div>
</div>
