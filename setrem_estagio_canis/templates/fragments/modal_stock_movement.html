<div
    class="fixed inset-0 z-50 bg-black/75 backdrop-blur-[2px] flex items-center justify-center p-4 overflow-y-auto"
    onclick="if (event.target === this) closeModal();">
    <div class="bg-surface border border-subtle rounded-2xl w-full max-w-lg overflow-hidden shadow-2xl">
        <div class="px-6 py-4 border-b border-subtle flex items-center justify-between">
            <div>
                <h3 class="text-base font-bold text-ink-primary">Entrada / Saida de Estoque</h3>
                <p class="text-xs text-ink-secondary mt-0.5">Registre doacoes recebidas ou baixas de consumo</p>
            </div>
            <button type="button" onclick="closeModal()" aria-label="Fechar" class="p-1.5 rounded-lg text-ink-secondary hover:text-ink-primary hover:bg-elevated">
                <i class="mdi mdi-close text-lg"></i>
            </button>
        </div>

        {% if stock_items %}
        <form action="/estoque/movimentacao" method="post" class="p-6 space-y-4 text-xs">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="space-y-1.5 sm:col-span-2">
                    <label class="block font-medium text-ink-secondary">Item de estoque</label>
                    <select name="item_id" class="w-full px-3.5 py-2.5 bg-elevated border border-subtle rounded-xl text-ink-primary focus:outline-none focus:border-patas-blue">
                        {% for item in stock_items %}
                        <option value="{{ item.id }}">{{ item.name }} (Saldo: {{ item.quantity }} {{ item.unit }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="space-y-1.5">
                    <label class="block font-medium text-ink-secondary">Tipo de movimentacao</label>
                    <select name="movement_type" class="w-full px-3.5 py-2.5 bg-elevated border border-subtle rounded-xl text-ink-primary focus:outline-none focus:border-patas-blue">
                        <option value="Entrada">Entrada (Compra / Doacao)</option>
                        <option value="Saida">Saida (Consumo / Repasse)</option>
                    </select>
                </div>
                <div class="space-y-1.5">
                    <label class="block font-medium text-ink-secondary">Quantidade</label>
                    <input type="number" name="quantity" min="1" value="1" required class="w-full px-3.5 py-2.5 bg-elevated border border-subtle rounded-xl font-mono text-ink-primary focus:outline-none focus:border-patas-blue">
                </div>
            </div>

            <div class="pt-3 border-t border-subtle flex justify-end gap-2.5">
                <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-elevated hover:bg-subtle border border-subtle font-medium text-ink-primary">
                    Cancelar
                </button>
                <button type="submit" class="px-4 py-2 rounded-xl bg-patas-green hover:bg-patas-green-hover text-[#061c14] font-semibold">
                    Confirmar
                </button>
            </div>
        </form>
        {% else %}
        <div class="p-6 text-center space-y-3 text-xs">
            <p class="text-ink-secondary">Nenhum item cadastrado no estoque ainda. Cadastre um item primeiro pelo botao "Novo Item".</p>
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-elevated hover:bg-subtle border border-subtle font-medium text-ink-primary">
                Fechar
            </button>
        </div>
        {% endif %}
    </div>
</div>
