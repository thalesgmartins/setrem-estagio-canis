<div
    class="fixed inset-0 z-50 bg-black/75 backdrop-blur-[2px] flex items-center justify-center p-4 overflow-y-auto"
    onclick="if (event.target === this) closeModal();">
    <div class="bg-surface border border-subtle rounded-2xl w-full max-w-lg overflow-hidden shadow-2xl my-auto">
        <div class="px-6 py-4 border-b border-subtle flex items-center justify-between">
            <h3 class="text-base font-bold text-ink-primary">Novo Item de Estoque</h3>
            <button type="button" onclick="closeModal()" aria-label="Fechar" class="p-1.5 rounded-lg text-ink-secondary hover:text-ink-primary hover:bg-elevated">
                <i class="mdi mdi-close text-lg"></i>
            </button>
        </div>

        <form action="/estoque/itens" method="post" enctype="multipart/form-data" class="p-6 space-y-4 text-xs">
            <div class="space-y-1.5">
                <label class="block font-medium text-ink-secondary">Nome do item</label>
                <input type="text" name="name" required placeholder="Ex: Ração Seca Cães Adultos (15kg)" class="w-full px-3.5 py-2.5 bg-elevated border border-subtle rounded-xl text-ink-primary placeholder-ink-muted focus:outline-none focus:border-patas-blue">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="space-y-1.5">
                    <label class="block font-medium text-ink-secondary">Categoria</label>
                    <select name="category" class="w-full px-3.5 py-2.5 bg-elevated border border-subtle rounded-xl text-ink-primary focus:outline-none focus:border-patas-blue">
                        <option value="Ração">Ração</option>
                        <option value="Higiene">Higiene</option>
                        <option value="Acessórios">Acessórios</option>
                    </select>
                </div>
                <div class="space-y-1.5">
                    <label class="block font-medium text-ink-secondary">Unidade</label>
                    <input type="text" name="unit" required value="sacos" placeholder="sacos, pacotes, kg, un" class="w-full px-3.5 py-2.5 bg-elevated border border-subtle rounded-xl text-ink-primary focus:outline-none focus:border-patas-blue">
                </div>
                <div class="space-y-1.5">
                    <label class="block font-medium text-ink-secondary">Quantidade inicial</label>
                    <input type="number" name="quantity" min="0" value="5" required class="w-full px-3.5 py-2.5 bg-elevated border border-subtle rounded-xl font-mono text-ink-primary focus:outline-none focus:border-patas-blue">
                </div>
                <div class="space-y-1.5">
                    <label class="block font-medium text-ink-secondary">Alerta de mínimo</label>
                    <input type="number" name="min_quantity" min="0" value="2" required class="w-full px-3.5 py-2.5 bg-elevated border border-subtle rounded-xl font-mono text-ink-primary focus:outline-none focus:border-patas-blue">
                </div>
            </div>

            <div class="space-y-1.5">
                <label class="block font-medium text-ink-secondary">Imagem do produto (opcional)</label>
                <input
                    type="file"
                    name="imagem"
                    accept="image/*"
                    data-crop-square="true"
                    data-crop-size="512"
                    class="w-full px-3 py-2 bg-elevated border border-subtle rounded-xl text-xs text-ink-secondary file:mr-3 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-patas-green/15 file:text-patas-green hover:file:bg-patas-green/25">
            </div>

            <div class="pt-3 border-t border-subtle flex justify-end gap-2.5">
                <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-elevated hover:bg-subtle border border-subtle font-medium text-ink-primary">
                    Cancelar
                </button>
                <button type="submit" class="px-4 py-2 rounded-xl bg-patas-green hover:bg-patas-green-hover text-[#061c14] font-semibold">
                    Salvar Item
                </button>
            </div>
        </form>
    </div>
</div>
