<div
    class="fixed inset-0 z-50 bg-black/75 backdrop-blur-[2px] flex items-center justify-center p-4 overflow-y-auto"
    onclick="if (event.target === this) closeModal();">
    <div class="bg-surface border border-subtle rounded-2xl w-full max-w-lg overflow-hidden shadow-2xl my-auto">
        <div class="px-6 py-4 border-b border-subtle flex items-center justify-between">
            <div>
                <h3 class="text-base font-bold text-ink-primary">Registrar Adoção</h3>
                <p class="text-xs text-ink-secondary mt-0.5">O animal selecionado será marcado automaticamente como Adotado</p>
            </div>
            <button type="button" onclick="closeModal()" aria-label="Fechar" class="p-1.5 rounded-lg text-ink-secondary hover:text-ink-primary hover:bg-elevated">
                <i class="mdi mdi-close text-lg"></i>
            </button>
        </div>

        {% if animals %}
        <form action="/adocoes" method="post" class="p-6 space-y-4 text-xs">
            <div class="space-y-1.5">
                <label class="block font-medium text-ink-secondary">Animal adotado</label>
                <select name="animal_id" required class="w-full px-3.5 py-2.5 bg-elevated border border-subtle rounded-xl text-ink-primary focus:outline-none focus:border-patas-blue">
                    {% for animal in animals %}
                    <option value="{{ animal.id }}" {% if selected_animal_id == animal.id %}selected{% endif %}>{{ animal.name }} ({{ animal.species }} · {{ animal.status }})</option>
                    {% endfor %}
                </select>
            </div>

            {% if foster_homes %}
            <div class="space-y-1.5 p-3.5 rounded-xl bg-elevated/50 border border-subtle">
                <label class="block font-medium text-ink-secondary">Preencher com Lar Temporário já cadastrado (opcional)</label>
                <select
                    id="foster-prefill-select"
                    onchange="
                        const opt = this.options[this.selectedIndex];
                        if (opt && opt.value) {
                            document.getElementById('adopter_name').value = opt.dataset.name || '';
                            document.getElementById('adopter_contact').value = opt.dataset.contact || '';
                            document.getElementById('adopter_address').value = opt.dataset.neighborhood ? 'Bairro ' + opt.dataset.neighborhood : '';
                        }
                    "
                    class="w-full px-3.5 py-2 bg-surface border border-subtle rounded-xl text-ink-primary focus:outline-none focus:border-patas-blue">
                    <option value="">Novo adotante (preencher manualmente)</option>
                    {% for home in foster_homes %}
                    <option
                        value="{{ home.id }}"
                        data-name="{{ home.volunteer_name }}"
                        data-contact="{{ home.contact }}"
                        data-neighborhood="{{ home.neighborhood }}"
                        {% if prefill_home and prefill_home.id == home.id %}selected{% endif %}>
                        {{ home.volunteer_name }} — Bairro {{ home.neighborhood }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            {% endif %}

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="space-y-1.5 sm:col-span-2">
                    <label class="block font-medium text-ink-secondary">Nome do adotante</label>
                    <input id="adopter_name" type="text" name="adopter_name" required value="{{ prefill_home.volunteer_name if prefill_home else '' }}" placeholder="Nome completo" class="w-full px-3.5 py-2.5 bg-elevated border border-subtle rounded-xl text-ink-primary placeholder-ink-muted focus:outline-none focus:border-patas-blue">
                </div>
                <div class="space-y-1.5">
                    <label class="block font-medium text-ink-secondary">CPF</label>
                    <input type="text" name="adopter_cpf" required placeholder="000.000.000-00" class="w-full px-3.5 py-2.5 bg-elevated border border-subtle rounded-xl font-mono text-ink-primary placeholder-ink-muted focus:outline-none focus:border-patas-blue">
                </div>
                <div class="space-y-1.5">
                    <label class="block font-medium text-ink-secondary">Telefone / WhatsApp</label>
                    <input id="adopter_contact" type="text" name="adopter_contact" required value="{{ prefill_home.contact if prefill_home else '' }}" placeholder="(55) 99999-0000" class="w-full px-3.5 py-2.5 bg-elevated border border-subtle rounded-xl font-mono text-ink-primary placeholder-ink-muted focus:outline-none focus:border-patas-blue">
                </div>
                <div class="space-y-1.5 sm:col-span-2">
                    <label class="block font-medium text-ink-secondary">Endereço</label>
                    <input id="adopter_address" type="text" name="adopter_address" required value="{{ 'Bairro ' ~ prefill_home.neighborhood if prefill_home else '' }}" placeholder="Rua, número e bairro" class="w-full px-3.5 py-2.5 bg-elevated border border-subtle rounded-xl text-ink-primary placeholder-ink-muted focus:outline-none focus:border-patas-blue">
                </div>
            </div>

            <div class="pt-3 border-t border-subtle flex justify-end gap-2.5">
                <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-elevated hover:bg-subtle border border-subtle font-medium text-ink-primary">
                    Cancelar
                </button>
                <button type="submit" class="px-4 py-2 rounded-xl bg-patas-green hover:bg-patas-green-hover text-[#061c14] font-semibold">
                    Confirmar Adoção
                </button>
            </div>
        </form>
        {% else %}
        <div class="p-6 text-center space-y-3 text-xs">
            <p class="text-ink-secondary">Nenhum animal disponível para registrar adoção. Cadastre um animal primeiro na aba Animais.</p>
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-elevated hover:bg-subtle border border-subtle font-medium text-ink-primary">
                Fechar
            </button>
        </div>
        {% endif %}
    </div>
</div>
