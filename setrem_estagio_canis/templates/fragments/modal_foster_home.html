<div
    class="fixed inset-0 z-50 bg-black/75 backdrop-blur-[2px] flex items-center justify-center p-4 overflow-y-auto"
    onclick="if (event.target === this) closeModal();">
    <div class="bg-surface border border-subtle rounded-2xl w-full max-w-lg overflow-hidden shadow-2xl">
        <div class="px-6 py-4 border-b border-subtle flex items-center justify-between">
            <h3 class="text-base font-bold text-ink-primary">
                {% if home %}Editar Lar Temporario{% else %}Novo Lar Temporario{% endif %}
            </h3>
            <button type="button" onclick="closeModal()" aria-label="Fechar" class="p-1.5 rounded-lg text-ink-secondary hover:text-ink-primary hover:bg-elevated">
                <i class="mdi mdi-close text-lg"></i>
            </button>
        </div>

        <form action="{% if home %}/lares/{{ home.id }}/editar{% else %}/lares{% endif %}" method="post" class="p-6 space-y-4 text-xs">
            <div class="space-y-1.5">
                <label class="block font-medium text-ink-secondary">Nome do voluntario</label>
                <input type="text" name="volunteer_name" required value="{{ home.volunteer_name if home else '' }}" placeholder="Ex: Maria Oliveira" class="w-full px-3.5 py-2.5 bg-elevated border border-subtle rounded-xl text-ink-primary placeholder-ink-muted focus:outline-none focus:border-patas-blue">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div class="space-y-1.5">
                    <label class="block font-medium text-ink-secondary">Telefone / WhatsApp</label>
                    <input type="text" name="contact" required value="{{ home.contact if home else '' }}" placeholder="(55) 99999-0000" class="w-full px-3.5 py-2.5 bg-elevated border border-subtle rounded-xl font-mono text-ink-primary placeholder-ink-muted focus:outline-none focus:border-patas-blue">
                </div>
                <div class="space-y-1.5">
                    <label class="block font-medium text-ink-secondary">Bairro</label>
                    <input type="text" name="neighborhood" required value="{{ home.neighborhood if home else '' }}" placeholder="Ex: Centro" class="w-full px-3.5 py-2.5 bg-elevated border border-subtle rounded-xl text-ink-primary placeholder-ink-muted focus:outline-none focus:border-patas-blue">
                </div>
            </div>

            <div class="space-y-1.5">
                <label class="block font-medium text-ink-secondary">Capacidade (numero de animais)</label>
                <input type="number" name="capacity" min="1" value="{{ home.capacity if home else 1 }}" required class="w-full px-3.5 py-2.5 bg-elevated border border-subtle rounded-xl font-mono text-ink-primary focus:outline-none focus:border-patas-blue">
            </div>

            <div class="pt-3 border-t border-subtle flex justify-end gap-2.5">
                <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-elevated hover:bg-subtle border border-subtle font-medium text-ink-primary">
                    Cancelar
                </button>
                <button type="submit" class="px-4 py-2 rounded-xl bg-patas-green hover:bg-patas-green-hover text-[#061c14] font-semibold">
                    {% if home %}Salvar Alteracoes{% else %}Cadastrar Lar{% endif %}
                </button>
            </div>
        </form>
    </div>
</div>
