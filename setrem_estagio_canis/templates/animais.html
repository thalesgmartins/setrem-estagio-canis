{% extends "base.html" %}

{% block content %}
<div class="space-y-6">

    <!-- Header -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
            <h1 class="text-2xl font-bold tracking-tight text-ink-primary">Animais</h1>
            <p class="text-sm text-ink-secondary mt-0.5">
                Clique em qualquer animal para editar dados, trocar lar temporario ou registrar consultas.
            </p>
        </div>
        <button
            type="button"
            hx-get="/modais/novo-resgate"
            hx-target="#modal-container"
            hx-swap="innerHTML"
            class="px-4 py-2.5 rounded-xl bg-patas-green hover:bg-patas-green-hover text-[#061c14] text-xs font-semibold transition-colors inline-flex items-center gap-1.5 self-start sm:self-auto">
            <i class="mdi mdi-plus text-base"></i>
            <span>Cadastrar Animal</span>
        </button>
    </div>

    {% if msg_ok %}
    <div class="p-3.5 rounded-xl bg-patas-green/15 border border-patas-green/25 text-xs text-patas-green font-medium">
        {{ msg_ok }}
    </div>
    {% endif %}

    <!-- Live HTMX Filter Bar -->
    <div class="bg-surface border border-subtle rounded-xl p-4 flex flex-col md:flex-row gap-3 items-stretch md:items-center">
        <div class="relative flex-1">
            <i class="mdi mdi-magnify text-base text-ink-muted absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
            <input
                type="search"
                name="termo"
                placeholder="Buscar por nome, raca ou localizacao..."
                hx-get="/animais/busca"
                hx-trigger="keyup changed delay:220ms, search"
                hx-target="#animal-table-container"
                hx-include="[name='status_filtro']"
                class="w-full pl-10 pr-4 py-2 text-xs bg-elevated border border-subtle rounded-xl text-ink-primary placeholder-ink-muted focus:outline-none focus:border-patas-blue focus:ring-1 focus:ring-patas-blue">
        </div>

        <div class="w-full md:w-60">
            <select
                name="status_filtro"
                hx-get="/animais/busca"
                hx-trigger="change"
                hx-target="#animal-table-container"
                hx-include="[name='termo']"
                class="w-full px-3.5 py-2 text-xs bg-elevated border border-subtle rounded-xl text-ink-primary focus:outline-none focus:border-patas-blue focus:ring-1 focus:ring-patas-blue">
                <option value="">Todos os status</option>
                <option value="Disponivel para Adocao">Disponivel para Adocao</option>
                <option value="Lar Temporario">Lar Temporario</option>
                <option value="Acolhido">Acolhido</option>
                <option value="Em Tratamento">Em Tratamento</option>
                <option value="Adotado">Adotado</option>
            </select>
        </div>
    </div>

    <div id="animal-table-container">
        {% include "fragments/animal_table.html" %}
    </div>

</div>
{% endblock %}
